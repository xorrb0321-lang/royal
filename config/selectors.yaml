# Phase 0 UI 정찰 후 Windows + Inspect.exe 결과로 조정하세요.
process:
  name: "KakaoTalk.exe"

windows:
  main:
    class_name: ""
    name_contains: "카카오톡"
  chat_popup:
    class_name: ""
    name_excludes: ["카카오톡"]

message_area:
  control_type: "List"
  search_depth: 20

message_item:
  control_type: "ListItem"

message_text:
  control_types:
    - "Text"
    - "Hyperlink"
